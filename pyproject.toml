[project]
name = "guardian-contexto"
version = "0.1.0"
description = "Guardián de contexto: retira instrucciones maliciosas de las salidas de herramientas antes de que lleguen al LLM."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# El guardián real. Sin esto solo funciona el mock (GUARD_MOCK=1).
# Torch para CPU: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
guard = ["numpy", "sentence-transformers", "pyyaml"]
# Evaluación (Integración): AgentDojo con el detector DeBERTa y pytest. Versión fija para reproducir.
bench = ["agentdojo[transformers]==0.1.35", "pytest"]

[tool.setuptools]
packages = ["guard"]

[tool.setuptools.package-data]
guard = ["artifacts/*.npz"]
