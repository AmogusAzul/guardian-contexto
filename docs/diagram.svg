<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Guardián de salidas MCP: arquitectura y roles</title>
  <desc id="d">El agente (LLM de OpenAI) recibe una tarea y llama herramientas MCP o del entorno de AgentDojo. Lo que devuelve cada herramienta pasa por el guardián de embeddings (punto rojo) antes de entrar al contexto del agente; el guardián retira los trozos con instrucciones maliciosas y devuelve la salida limpia. Los datos entrenan y calibran al guardián. La evaluación corre AgentDojo y MCPTox contra líneas base y sus resultados van a la ficha técnica. Las regiones de color son los roles: Datos, Integración y benchmarks, Algoritmo y Pitch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Fondo explícito: se ve igual en visores claros y oscuros -->
  <rect x="0" y="0" width="920" height="520" fill="#ffffff"/>

  <!-- ===== Regiones de rol ===== -->
  <!-- Integración y benchmarks: agente + herramientas -->
  <rect x="250" y="20" width="650" height="160" rx="16" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="266" y="46" font-size="15" font-weight="700" fill="#15803d">INTEGRACIÓN Y BENCHMARKS</text>
  <!-- Integración y benchmarks: evaluación -->
  <rect x="520" y="340" width="380" height="120" rx="16" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <!-- Algoritmo: guardián -->
  <rect x="400" y="200" width="270" height="120" rx="16" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="416" y="226" font-size="15" font-weight="700" fill="#1d4ed8">ALGORITMO</text>
  <!-- Datos -->
  <rect x="20" y="340" width="420" height="120" rx="16" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="2"/>
  <text x="36" y="366" font-size="15" font-weight="700" fill="#c2410c">DATOS</text>
  <!-- Pitch: círculo independiente, sin conexiones -->
  <circle cx="120" cy="245" r="52" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="2"/>
  <text x="120" y="251" font-size="17" font-weight="700" fill="#7e22ce" text-anchor="middle">PITCH</text>
  <rect x="45" y="304" width="150" height="24" rx="8" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="321" font-size="12" font-style="italic" fill="#581c87" text-anchor="middle">conoce todo el sistema</text>

  <!-- ===== Conexiones ===== -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <!-- Tarea -> Agente -->
    <path d="M190,115 L278,115" marker-end="url(#arrow)"/>
    <!-- Agente -> Herramientas (llamada) -->
    <path d="M460,100 L628,100" marker-end="url(#arrow)"/>
    <!-- Herramientas -> Guardián (salida cruda) -->
    <path d="M760,150 L760,260 L672,260" marker-end="url(#arrow)"/>
    <!-- Guardián -> Agente (salida limpia) -->
    <path d="M500,260 L370,260 L370,152" marker-end="url(#arrow)"/>
    <!-- Datos -> Guardián -->
    <path d="M292,400 L470,400 L470,322" marker-end="url(#arrow)"/>
    <!-- Datos -> Evaluación (conjuntos de prueba) -->
    <path d="M440,430 L533,430" marker-end="url(#arrow)"/>
    <!-- Guardián -> Evaluación -->
    <path d="M610,298 L610,368" marker-end="url(#arrow)"/>
  </g>
  <circle cx="760" cy="205" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <g font-size="12" fill="#334155">
    <text x="544" y="92" text-anchor="middle">llamada a herramienta</text>
    <text x="770" y="200">salida cruda</text>
    <text x="362" y="196" text-anchor="end">salida limpia</text>
    <text x="362" y="211" text-anchor="end">al contexto</text>
    <text x="462" y="334" text-anchor="end">entrena y calibra</text>
    <text x="618" y="333">mismo check()</text>
  </g>

  <!-- ===== Cajas ===== -->
  <g stroke="#334155" stroke-width="2" fill="#ffffff">
    <rect x="30" y="80" width="160" height="70" rx="8"/>
    <rect x="280" y="80" width="180" height="70" rx="8"/>
    <rect x="630" y="70" width="250" height="80" rx="8"/>
    <rect x="500" y="230" width="170" height="70" rx="8" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="40" y="380" width="250" height="66" rx="8"/>
    <rect x="535" y="370" width="350" height="76" rx="8"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="110" y="109" font-size="15" font-weight="700">Tarea del usuario</text>
    <text x="110" y="128" font-size="12" fill="#475569">legítima e inocente</text>
    <text x="370" y="109" font-size="15" font-weight="700">Agente</text>
    <text x="370" y="128" font-size="12" fill="#475569">LLM de OpenAI</text>
    <text x="755" y="98" font-size="15" font-weight="700">Herramientas MCP</text>
    <text x="755" y="117" font-size="12" fill="#475569">entornos de AgentDojo</text>
    <text x="755" y="134" font-size="12" fill="#475569">(correo, banco, Slack, viajes)</text>
    <text x="585" y="258" font-size="15" font-weight="700">Guardián</text>
    <text x="585" y="276" font-size="12" fill="#475569">embeddings · trozos</text>
    <text x="585" y="291" font-size="12" fill="#475569">retira lo malicioso</text>
    <text x="165" y="406" font-size="15" font-weight="700">Datasets</text>
    <text x="165" y="424" font-size="12" fill="#475569">inyecciones · hard negatives</text>
    <text x="165" y="438" font-size="12" fill="#475569">salidas limpias · MCPTox</text>
    <text x="710" y="396" font-size="15" font-weight="700">Evaluación → results/ → ficha</text>
    <text x="710" y="414" font-size="12" fill="#475569">AgentDojo: utilidad y éxito del ataque</text>
    <text x="710" y="430" font-size="12" fill="#475569">MCPTox · línea base · DeBERTa</text>
  </g>

  <!-- ===== Leyenda ===== -->
  <line x1="20" y1="478" x2="900" y2="478" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="13" fill="#0f172a">
    <text x="20" y="504" font-weight="700">Roles:</text>
    <rect x="76" y="491" width="18" height="18" rx="4" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="1.5"/>
    <text x="100" y="504">Datos</text>
    <rect x="156" y="491" width="18" height="18" rx="4" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="1.5"/>
    <text x="180" y="504">Integración y benchmarks</text>
    <rect x="370" y="491" width="18" height="18" rx="4" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
    <text x="394" y="504">Algoritmo</text>
    <circle cx="479" cy="500" r="9" fill="#9333ea" fill-opacity="0.2" stroke="#9333ea" stroke-width="1.5"/>
    <text x="494" y="504">Pitch</text>
    <circle cx="566" cy="500" r="7" fill="#dc2626"/>
    <text x="580" y="504">check(): antes de que la salida entre al contexto</text>
  </g>
</svg>
