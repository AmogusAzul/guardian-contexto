<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Arquitectura del guardián de prompts y roles del equipo</title>
  <desc id="d">Los prompts buenos y maliciosos entran al Frontend; entre Frontend y Backend hay un punto de intercepción (la llamada a check() dentro de /api/chat) que consulta al Algoritmo guardián (embeddings); el Backend llama a la API del LLM; el RAG alimenta al Backend y al Algoritmo. Las regiones de color indican los roles: Datos, Servidor/Chatbot, Algoritmo y Pitch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Fondo explícito: se ve igual en visores claros y oscuros -->
  <rect x="0" y="0" width="920" height="500" fill="#ffffff"/>

  <!-- ===== Regiones de rol (debajo de todo) ===== -->
  <!-- Datos: prompts -->
  <rect x="20" y="20" width="210" height="232" rx="16" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="36" y="44" font-size="15" font-weight="700" fill="#1d4ed8">DATOS</text>
  <text x="36" y="63" font-size="13" fill="#1e3a8a">Responsable: ________</text>

  <!-- Servidor / Chatbot -->
  <rect x="268" y="78" width="444" height="122" rx="16" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="284" y="102" font-size="15" font-weight="700" fill="#15803d">SERVIDOR / CHATBOT</text>
  <text x="500" y="102" font-size="13" fill="#14532d">Responsable: ________</text>

  <!-- Algoritmo -->
  <rect x="290" y="262" width="300" height="124" rx="16" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="2"/>
  <text x="304" y="296" font-size="15" font-weight="700" fill="#c2410c">ALGORITMO</text>
  <text x="304" y="316" font-size="13" fill="#7c2d12">Responsable:</text>
  <text x="304" y="334" font-size="13" fill="#7c2d12">líder (yo)</text>

  <!-- Datos: RAG (misma región/color que los prompts) -->
  <rect x="634" y="262" width="272" height="124" rx="16" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="796" y="296" font-size="15" font-weight="700" fill="#1d4ed8">DATOS</text>
  <text x="796" y="316" font-size="13" fill="#1e3a8a">Responsable:</text>
  <text x="796" y="334" font-size="13" fill="#1e3a8a">________</text>

  <!-- Pitch: círculo independiente, sin conexiones -->
  <circle cx="135" cy="335" r="62" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="2"/>
  <text x="135" y="322" font-size="16" font-weight="700" fill="#7e22ce" text-anchor="middle">PITCH</text>
  <text x="135" y="342" font-size="13" fill="#581c87" text-anchor="middle">Responsable:</text>
  <text x="135" y="360" font-size="13" fill="#581c87" text-anchor="middle">________</text>
  <rect x="55" y="408" width="160" height="28" rx="8" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="135" y="427" font-size="13" font-style="italic" fill="#581c87" text-anchor="middle">conoce todo el sistema</text>

  <!-- ===== Conexiones ===== -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <!-- Prompts -> Frontend -->
    <path d="M205,108 L288,142" marker-end="url(#arrow)"/>
    <path d="M205,198 L288,158" marker-end="url(#arrow)"/>
    <!-- Frontend -> Backend (pasa por el punto de intercepción) -->
    <path d="M440,150 L538,150" marker-end="url(#arrow)"/>
    <!-- Backend -> API del LLM -->
    <path d="M690,150 L758,150" marker-end="url(#arrow)"/>
    <!-- Intercepción -> Algoritmo guardián -->
    <path d="M490,157 L490,278" marker-end="url(#arrow)"/>
    <!-- Backend <-> RAG -->
    <path d="M670,180 L670,306" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- RAG -> Algoritmo -->
    <path d="M650,336 L572,336" marker-end="url(#arrow)"/>
  </g>
  <circle cx="490" cy="150" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="498" y="236" font-size="13" font-weight="600" fill="#0f172a">check(text)</text>
  <text x="678" y="246" font-size="12" fill="#334155">contexto</text>
  <text x="612" y="328" font-size="12" fill="#334155" text-anchor="middle">tema</text>

  <!-- ===== Cajas ===== -->
  <g stroke="#334155" stroke-width="2" fill="#ffffff">
    <rect x="35" y="80" width="170" height="56" rx="8"/>
    <rect x="35" y="170" width="170" height="56" rx="8"/>
    <rect x="290" y="122" width="150" height="56" rx="8"/>
    <rect x="540" y="122" width="150" height="56" rx="8"/>
    <rect x="760" y="122" width="140" height="56" rx="8"/>
    <rect x="410" y="280" width="160" height="70" rx="8" stroke="#c2410c" stroke-width="2.5"/>
    <rect x="650" y="308" width="130" height="56" rx="8"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="120" y="104" font-size="15" font-weight="700">Prompts buenos</text>
    <text x="120" y="123" font-size="12" fill="#475569">benign + off_topic</text>
    <text x="120" y="194" font-size="15" font-weight="700">Prompts maliciosos</text>
    <text x="120" y="213" font-size="12" fill="#475569">attack</text>
    <text x="365" y="146" font-size="15" font-weight="700">Frontend</text>
    <text x="365" y="165" font-size="12" fill="#475569">chat UI · Angular</text>
    <text x="615" y="146" font-size="15" font-weight="700">Backend</text>
    <text x="615" y="165" font-size="12" fill="#475569">FastAPI · /api/chat</text>
    <text x="830" y="146" font-size="15" font-weight="700">API del LLM</text>
    <text x="830" y="165" font-size="12" fill="#475569">solo si pasa</text>
    <text x="490" y="306" font-size="15" font-weight="700">Algoritmo guardián</text>
    <text x="490" y="325" font-size="12" fill="#475569">Python · embeddings</text>
    <text x="490" y="341" font-size="12" fill="#475569">similitud coseno</text>
    <text x="715" y="332" font-size="15" font-weight="700">RAG</text>
    <text x="715" y="351" font-size="12" fill="#475569">docs del tema</text>
  </g>

  <!-- ===== Leyenda ===== -->
  <line x1="20" y1="456" x2="900" y2="456" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="13" fill="#0f172a">
    <text x="20" y="484" font-weight="700">Roles:</text>
    <rect x="76" y="471" width="18" height="18" rx="4" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
    <text x="100" y="484">Datos</text>
    <rect x="156" y="471" width="18" height="18" rx="4" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="1.5"/>
    <text x="180" y="484">Servidor / Chatbot</text>
    <rect x="316" y="471" width="18" height="18" rx="4" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="1.5"/>
    <text x="340" y="484">Algoritmo</text>
    <circle cx="425" cy="480" r="9" fill="#9333ea" fill-opacity="0.2" stroke="#9333ea" stroke-width="1.5"/>
    <text x="440" y="484">Pitch</text>
    <circle cx="512" cy="480" r="7" fill="#dc2626"/>
    <text x="526" y="484">check() dentro de /api/chat, antes del LLM</text>
  </g>
</svg>
